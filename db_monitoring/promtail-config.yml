server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://10.10.10.50:3100/loki/api/v1/push

scrape_configs:

  - job_name: system_syslog
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          host: database
          __path__: /var/log/syslog

  - job_name: system_auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          host: database
          __path__: /var/log/auth.log

  - job_name: system_kern
    static_configs:
      - targets: [localhost]
        labels:
          job: kernel
          host: database
          __path__: /var/log/kern.log

  - job_name: system_dpkg
    static_configs:
      - targets: [localhost]
        labels:
          job: dpkg
          host: database
          __path__: /var/log/dpkg.log

  - job_name: system_cron
    static_configs:
      - targets: [localhost]
        labels:
          job: cron
          host: database
          __path__: /var/log/{cron,cron.log}


  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["mariadb","postgres"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
      - source_labels: [__meta_docker_container_image]
        target_label: image
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - target_label: job
        replacement: docker
      - target_label: host
        replacement: database
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: mariadb_error
    static_configs:
      - targets: [localhost]
        labels:
          job: mariadb_error
          host: database
          container: mariadb
          __path__: /var/log/mysql/error.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d+:\d+:\d+)\s+(?P<thread>\d+)\s+\[(?P<level>\w+)\]\s+(?P<message>.*)$'

      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"

      - labels:
          level:
  - job_name: mariadb_general
    static_configs:
      - targets: [localhost]
        labels:
          job: mariadb_general
          host: database
          container: mariadb
          __path__: /var/log/mysql/general.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d+:\d+:\d+)\s+(?P<thread_id>\d+)\s+(?P<command>\w+)\s+(?P<message>.*)$'
      - labels:
          command:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05'


  - job_name: mariadb_slow
    static_configs:
      - targets: [localhost]
        labels:
          job: mariadb_slow
          host: database
          container: mariadb
          __path__: /var/log/mysql/slow.log
    pipeline_stages:
      - multiline:
          firstline: '^# Time:'
          max_wait_time: 3s
      - regex:
          expression: '^# Query_time:\s+(?P<query_time>\S+)\s+Lock_time:\s+(?P<lock_time>\S+)\s+Rows_sent:\s+(?P<rows_sent>\d+)\s+Rows_examined:\s+(?P<rows_examined>\d+)'
      - labels:
          query_time:

  - job_name: postgres_log
    static_configs:
      - targets: [localhost]
        labels:
          job: postgres
          host: database
          container: postgres
          __path__: /var/lib/postgresql/data/log/*.log
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}'
          max_wait_time: 3s
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+\s+\w+)\s+\[(?P<pid>\d+)\].*user=(?P<user>[^,]+),db=(?P<db>[^,]+),app=(?P<app>[^,]+),client=(?P<client>\S+)\s+(?P<level>\w+):'
      - labels:
          level:
          user:
          db:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000 MST'
