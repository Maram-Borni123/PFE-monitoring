server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.1.50:3100/loki/api/v1/push

scrape_configs:

  - job_name: nginx
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          host: webserver
          __path__: /var/log/nginx/*log

  - job_name: apache
    static_configs:
      - targets: [localhost]
        labels:
          job: apache
          host: webserver
          __path__: /var/log/apache2/*log

  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          host: webserver
          __path__: /var/log/host/syslog
