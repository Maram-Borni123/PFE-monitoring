services:

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8082:8082"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - webserver

  apache:
    image: httpd:2.4
    container_name: apache
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      - webserver

  varnish:
    image: varnish:7.4
    container_name: varnish
    restart: unless-stopped
    labels:
      - "promtail=true"
    command: >
      varnishd -F
      -a :80
      -T localhost:6082
      -f /etc/varnish/default.vcl
      -n varnish
    ports:
      - "6081:80"
      - "6082:6082"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
      - varnish_lib:/var/lib/varnish
    networks:
      - webserver
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|vboxsf)$$'
    networks:
      - webserver

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - webserver

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - '-nginx.scrape-uri=http://nginx:8082/stub_status'
    depends_on:
      - nginx
    networks:
      - webserver

  apache-exporter:
    image: lusotycoon/apache-exporter:latest
    container_name: apache-exporter
    restart: unless-stopped
    ports:
      - "9117:9117"
    command:
      - '--scrape_uri=http://apache:80/server-status?auto'
    depends_on:
      - apache
    networks:
      - webserver

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - varnish_logs:/var/log/varnish:ro
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - ./promtail:/var/lib/promtail
      - /var/log:/var/log/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro  # ← manquait
    command: -config.file=/etc/promtail/config.yml
    networks:
      - webserver

  varnish-exporter:
    image: jlcox1970/prometheus-varnish-exporter:7.4.2-1
    container_name: varnish-exporter
    restart: unless-stopped
    user: "0:1000"
    depends_on:
      - varnish
    ports:
      - "9131:9131"
    command:
      - "-n"
      - "/var/lib/varnish/varnish"
    volumes:
      - varnish_lib:/var/lib/varnish
    networks:
      - webserver
  varnish-logger:
    image: varnish:7.4
    container_name: varnish-logger
    restart: unless-stopped
    user: varnish
    command: >
      varnishncsa -n /var/lib/varnish/varnish
      -a -w /var/log/varnish/access.log
    volumes:
      - varnish_lib:/var/lib/varnish
      - varnish_logs:/var/log/varnish
    depends_on:
      - varnish
    networks:
      - webserver
networks:
  webserver:

volumes:
  varnish_lib:
  varnish_logs:
