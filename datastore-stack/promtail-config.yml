server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn
positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.10.10.50:3100/loki/api/v1/push

scrape_configs:

  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: nosql
          __path__: /var/log/syslog

  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: nosql
          __path__: /var/log/auth.log

  - job_name: kern
    static_configs:
      - targets:
          - localhost
        labels:
          job: kern
          host: nosql
          __path__: /var/log/kern.log

  - job_name: dpkg
    static_configs:
      - targets:
          - localhost
        labels:
          job: dpkg
          host: nosql
          __path__: /var/log/dpkg.log

  - job_name: mongodb
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["mongodb"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/mongodb"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      - replacement: mongodb
        target_label: job
      - replacement: nosql
        target_label: host
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: redis
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["redis"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/redis"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      - replacement: redis
        target_label: job
      - replacement: nosql
        target_label: host
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: memcached
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["memcached"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/memcached"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      - replacement: memcached
        target_label: job
      - replacement: nosql
        target_label: host
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: promtail
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["promtail"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/promtail"
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      - replacement: promtail
        target_label: job
      - replacement: nosql
        target_label: host
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}
