server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://10.10.10.50:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          host: nosql-vm
          __path__: /var/log/*.log

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_image]
        target_label: image
      - target_label: job
        replacement: docker
      - source_labels: [__meta_docker_container_name]
        regex: '/redis$'
        action: replace
        target_label: service
        replacement: redis
      - source_labels: [__meta_docker_container_name]
        regex: '/memcached$'
        action: replace
        target_label: service
        replacement: memcached
      - source_labels: [__meta_docker_container_name]
        regex: '/mongodb$'
        action: replace
        target_label: service
        replacement: mongodb
      - source_labels: [__meta_docker_container_name]
        regex: '/redis_exporter$'
        action: replace
        target_label: service
        replacement: redis_exporter
      - source_labels: [__meta_docker_container_name]
        regex: '/memcached_exporter$'
        action: replace
        target_label: service
        replacement: memcached_exporter
      - source_labels: [__meta_docker_container_name]
        regex: '/mongodb_exporter$'
        action: replace
        target_label: service
        replacement: mongodb_exporter
      - source_labels: [__meta_docker_container_name]
        regex: '/node_exporter$'
        action: replace
        target_label: service
        replacement: node_exporter
      - source_labels: [__meta_docker_container_name]
        regex: '/cadvisor$'
        action: replace
        target_label: service
        replacement: cadvisor
      - source_labels: [__meta_docker_container_name]
        regex: '/promtail$'
        action: replace
        target_label: service
        replacement: promtail
      - source_labels: [service]
        regex: '^$'
        action: replace
        target_label: service
        replacement: unknown
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '(?P<level>INFO|WARN|ERROR|DEBUG)'
      - labels:
          level:
          container:
          service:
          image:
