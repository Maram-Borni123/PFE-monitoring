worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name 10.10.10.50;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 10.10.10.50;

        ssl_certificate     /etc/nginx/certs/monitoring.crt;
        ssl_certificate_key /etc/nginx/certs/monitoring.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass         http://grafana:3000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        location /prometheus/ {
            proxy_pass         http://prometheus:9090/prometheus/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            auth_basic         "Prometheus - acces restreint";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
        }

        location /alertmanager/ {
            proxy_pass         http://alertmanager:9093/alertmanager/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            auth_basic         "Alertmanager - acces restreint";
            auth_basic_user_file /etc/nginx/certs/.htpasswd;
        }
    }
}
