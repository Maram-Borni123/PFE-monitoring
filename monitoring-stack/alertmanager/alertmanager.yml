global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'maramborni.pfe@gmail.com'
  smtp_auth_username: 'maramborni.pfe@gmail.com'
  smtp_auth_password: '**** **** ****'
  smtp_require_tls: true

route:
  receiver: 'email-admin'

  group_by: ['alertname', 'instance', 'severity','vm_name']

  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h

  routes:

    - match:
        severity: critical
      receiver: 'email-admin'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'email-admin'
      repeat_interval: 4h

receivers:
  - name: 'email-admin'
    email_configs:
      - to: 'maramborni@outlook.com'
        send_resolved: true
        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }} — {{ .GroupLabels.vm_name }} ({{ .GroupLabels.instance }})'
        text: |
          {{ range .Alerts }}
          ==========================================
          ALERT : {{ .Annotations.summary }}
          ==========================================
          Status    : {{ .Status | toUpper }}
          Severity  : {{ .Labels.severity }}
          Instance  : {{ .Labels.instance }}
          Job       : {{ .Labels.job }}
          Started   : {{ .StartsAt.Format "2006-01-02 15:04:05" }}

          Detail:
          {{ .Annotations.description }}
          ==========================================
          {{ end }}

inhibit_rules:
  - source_matchers:
      - alertname="VMDown"
    target_matchers:
      - alertname=~".+"
    equal: ['vm_name']
