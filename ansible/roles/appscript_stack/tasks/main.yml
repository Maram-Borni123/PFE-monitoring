---
- name: Create promtail config directory
  file:
    path: "{{ monitoring_dir }}/promtail"
    state: directory
    mode: '0755'

- name: Generate promtail config from template
  template:
    src: promtail.yml.j2
    dest: "{{ monitoring_dir }}/promtail/promtail.yml"
    mode: '0644'

- name: Create stack directory
  file:
    path: "{{ monitoring_dir }}/stack"
    state: directory
    mode: '0755'

- name: Copy docker-compose.yml to VM
  copy:
    src: docker-compose.yml
    dest: "{{ monitoring_dir }}/stack/docker-compose.yml"
    mode: '0644'

- name: Stop old containers if running
  shell: docker rm -f node_exporter cadvisor promtail 2>/dev/null || true
  changed_when: false

- name: Launch stack with docker compose
  shell: docker compose -f {{ monitoring_dir }}/stack/docker-compose.yml up -d
  register: compose_up

- name: Show compose output
  debug:
    msg: "{{ compose_up.stdout_lines }}"

- name: Verify containers are running
  shell: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  register: docker_ps
  changed_when: false

- name: Show running containers
  debug:
    msg: "{{ docker_ps.stdout_lines }}"
